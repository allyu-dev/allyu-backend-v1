name: Deploy Lightsail demo
on:
  workflow_dispatch:

concurrency:
  group: lightsail-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LIGHTSAIL_SERVICE_NAME: ${{ vars.LIGHTSAIL_SERVICE_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate configuration
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          test -n "$AWS_REGION"
          test -n "$LIGHTSAIL_SERVICE_NAME"
          test -n "$ECR_REPOSITORY_URL"
          test -n "$DEPLOY_ROLE"
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: node --test scripts/deploy-lightsail.test.mjs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:demo-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: false
      - name: Deploy and check health
        env:
          DEPLOY_IMAGE: ${{ vars.ECR_REPOSITORY_URL }}@${{ steps.image.outputs.digest }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/deploy-lightsail.mjs
